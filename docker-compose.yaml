services:
 postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartpass
      POSTGRES_USER: eyob
      POSTGRES_PASSWORD: okay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eyob -d smartpass"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
 postgres_data:
